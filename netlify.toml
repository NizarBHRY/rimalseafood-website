# The website is an Astro site built into dist/. Netlify runs `npm run build`,
# which also copies the staff dashboard (site/manage.html) and writes
# dist/_headers (security headers) — see scripts/postbuild.mjs.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"
