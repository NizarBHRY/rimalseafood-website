<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found · Rimal Seafood</title>
  <link rel="icon" type="image/png" href="/rimal-icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Netlify shows this page for any address that doesn't exist.
       Paths start with "/" so it works at any depth (e.g. /a/b/c). */
    :root{
      --navy:#14284B; --teal:#1B6C72; --ivory:#F6F1E7; --slate:#56627A; --line:#E2D7C1; --gold:#B08A3E;
      --font-display:'Cormorant Garamond','Times New Roman',serif;
      --font-body:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ivory);color:var(--navy);font:400 16px/1.6 var(--font-body);padding:32px 16px;text-align:center;}
    main{max-width:520px;}
    .logo{width:180px;height:auto;display:block;margin:0 auto 20px;}
    .rule{width:64px;height:1px;background:var(--gold);margin:0 auto 18px;border:0;}
    .code{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#7F6120;font-weight:600;}
    h1{font-family:var(--font-display);font-size:clamp(34px,7vw,46px);line-height:1.1;margin:6px 0 12px;}
    p{color:var(--slate);margin-bottom:24px;}
    nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
    nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid var(--navy);border-radius:6px;color:var(--navy);font-weight:600;text-decoration:none;}
    nav a.primary{background:var(--navy);color:#fff;}
    nav a:focus-visible,.phone:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
    .phone{color:var(--teal);text-underline-offset:3px;}
  </style>
</head>
<body>
  <main>
    <a href="/"><img class="logo" src="/rimal-logo.webp" alt="Rimal Seafood home" width="480" height="278"></a>
    <hr class="rule">
    <p class="code">Error 404</p>
    <h1>We couldn't find that page</h1>
    <p>The link may be old or mistyped. Our menu and fish market are just a tap away, or call us at <a class="phone" href="tel:+13474974004">(347) 497-4004</a>.</p>
    <nav aria-label="Where to go next">
      <a class="primary" href="/#menu">See the menu</a>
      <a href="/#market">Fish market</a>
      <a href="/">Home</a>
    </nav>
  </main>
</body>
</html>
